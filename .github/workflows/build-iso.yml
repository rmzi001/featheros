name: FeatherOS CI & ISO Builder

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      debian_suite:
        description: "Debian suite (trixie or bookworm)"
        required: false
        default: "trixie"
      build_iso:
        description: "Build bootable Live ISO artifact"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify:
    name: Test FeatherRun, Overlay & Build Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack initial source archive if present
        run: |
          if [ -f featheros-src.tar.gz ]; then
            tar -xzf featheros-src.tar.gz --exclude='.github/workflows*'
            rm -f featheros-src.tar.gz
            git config user.name "FeatherOS CI"
            git config user.email "ci@featheros.local"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(bootstrap): unpack FeatherOS source tree [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python unit & overlay tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Run build integrity validator
        run: python3 scripts/validate-build.py

      - name: Check bash syntax of build and VM scripts
        run: |
          bash -n build/build-iso.sh
          bash -n build/chroot-setup.sh
          bash -n scripts/run-qemu.sh
          sh -n desktop/overlay/etc/xdg/openbox/autostart
          sh -n desktop/overlay/usr/local/bin/feather-firstboot

  build-iso:
    name: Build Bootable FeatherOS ISO & QEMU Boot-Test
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_iso) ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build-iso]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main or tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'main' || github.ref }}

      - name: Ensure source unpacked
        run: |
          if [ -f featheros-src.tar.gz ]; then
            tar -xzf featheros-src.tar.gz --exclude='.github/workflows*'
            rm -f featheros-src.tar.gz
          fi

      - name: Install ISO build & QEMU boot-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debian-archive-keyring \
            debootstrap \
            dosfstools \
            grub-common \
            grub-efi-amd64-bin \
            grub-pc-bin \
            mtools \
            netpbm \
            qemu-system-x86 \
            socat \
            squashfs-tools \
            xorriso

      - name: Build FeatherOS Live ISO
        env:
          DEBIAN_SUITE: ${{ inputs.debian_suite || 'trixie' }}
        run: |
          sudo -E bash build/build-iso.sh
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Boot-test FeatherOS ISO in QEMU & capture live desktop screenshots
        run: |
          set -euo pipefail
          ISO_FILE="$(ls dist/featheros-*.iso | head -n 1)"
          ACCEL="-accel tcg"
          WAIT_EARLY=25
          WAIT_DESKTOP=115
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL="-enable-kvm -cpu host"
            WAIT_EARLY=18
            WAIT_DESKTOP=55
          fi
          echo "Boot-testing ${ISO_FILE} with QEMU (${ACCEL})..."
          rm -f /tmp/qemu-mon.sock dist/qemu-serial.log dist/boot-*.ppm dist/boot-*.png
          qemu-system-x86_64 ${ACCEL} \
            -m 2048 -smp 2 \
            -cdrom "${ISO_FILE}" \
            -boot d \
            -vga std \
            -display none \
            -monitor unix:/tmp/qemu-mon.sock,server,nowait \
            -serial file:dist/qemu-serial.log &
          QEMU_PID=$!

          sleep 3
          if ! kill -0 "${QEMU_PID}" 2>/dev/null; then
            echo "ERROR: QEMU exited unexpectedly right after start!" >&2
            exit 1
          fi

          sleep "${WAIT_EARLY}"
          echo "screendump dist/boot-early.ppm" | socat - UNIX-CONNECT:/tmp/qemu-mon.sock
          sleep "${WAIT_DESKTOP}"
          echo "screendump dist/boot-desktop.ppm" | socat - UNIX-CONNECT:/tmp/qemu-mon.sock
          echo "quit" | socat - UNIX-CONNECT:/tmp/qemu-mon.sock || true
          wait "${QEMU_PID}" || true

          for f in dist/boot-early.ppm dist/boot-desktop.ppm; do
            test -s "${f}"
            pnmtopng "${f}" > "${f%.ppm}.png"
            rm -f "${f}"
          done

          # Empirical check: verify screenshots exist and serial log captured Linux kernel boot
          test -s dist/boot-early.png
          test -s dist/boot-desktop.png
          test -s dist/qemu-serial.log
          grep -q "Linux version" dist/qemu-serial.log
          echo "=== FeatherOS QEMU Boot-Test PASSED ==="
          ls -lh dist/
          echo "=== Tail of qemu-serial.log ==="
          tail -n 50 dist/qemu-serial.log

      - name: Upload QEMU boot-test proof (screenshots, serial log & checksum)
        uses: actions/upload-artifact@v4
        with:
          name: featheros-boot-proof
          path: |
            dist/*.png
            dist/*.sha256
            dist/qemu-serial.log
          retention-days: 14

      - name: Upload FeatherOS ISO & SHA256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: featheros-live-iso
          path: |
            dist/*.iso
            dist/*.sha256
          retention-days: 14

      - name: Publish FeatherOS v0.1.0 Release with ISO & Boot Proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.0"
          TITLE="FeatherOS 0.1.0 (Plume)"
          NOTES="Lightweight Debian-based OS with FeatherShell desktop, FeatherRun Windows .exe/.msi compatibility layer, FeatherStore App Hub, and Calamares installer. Includes automated KVM QEMU boot-test screenshots."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/featheros-*.iso dist/featheros-*.sha256 dist/boot-early.png dist/boot-desktop.png dist/qemu-serial.log --clobber
          else
            gh release create "${TAG}" dist/featheros-*.iso dist/featheros-*.sha256 dist/boot-early.png dist/boot-desktop.png dist/qemu-serial.log --title "${TITLE}" --notes "${NOTES}"
          fi
