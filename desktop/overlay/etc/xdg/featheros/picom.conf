# FeatherOS Lightweight Picom Compositor Config
# Uses xrender backend for ultra-low RAM and rock-solid QEMU/VM compatibility.
backend = "xrender";
vsync = true;

# Subtle modern window shadows
shadow = true;
shadow-radius = 10;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;
shadow-exclude = [
  "class_g = 'Tint2'",
  "class_g = 'jgmenu'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Crisp, snappy transitions (no heavy blur/animations)
fading = false;

# Zero-overhead fullscreen Windows games & video playback
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;
