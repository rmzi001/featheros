# FeatherOS kernel tuning for low-RAM responsiveness and Wine/Proton/DirectX games
# High max_map_count prevents crashes in modern Windows games and Wine/Proton titles
vm.max_map_count = 1048576
# Balanced swap aggressiveness (works alongside zram compressed memory)
vm.swappiness = 60
vm.vfs_cache_pressure = 50
# Plenty of file descriptors for Wine Esync
fs.file-max = 524288
