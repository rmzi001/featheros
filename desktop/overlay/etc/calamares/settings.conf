# FeatherOS v0.4.0 Calamares Graphical Installer Configuration
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - removeuser
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - shellprocess
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: featheros
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
