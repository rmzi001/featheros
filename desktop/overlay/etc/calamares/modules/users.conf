# Default installed FeatherOS user account configuration (Debian sudo/Polkit compliant)
defaultGroups:
  - users
  - sudo
  - audio
  - video
  - plugdev
  - netdev
  - lp
  - cdrom
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: true
doReusePassword: true
userShell: /bin/bash
presets:
  fullName:
    value: ""
    editable: true
  loginName:
    value: ""
    editable: true
