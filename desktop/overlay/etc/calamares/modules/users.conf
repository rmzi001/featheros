# Default installed FeatherOS user account configuration
defaultGroups:
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: true
doReusePassword: true
userShell: /bin/bash
presets:
  fullName:
    value: ""
    editable: true
  loginName:
    value: ""
    editable: true
