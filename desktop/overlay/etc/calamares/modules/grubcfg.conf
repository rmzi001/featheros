# Configure /etc/default/grub on installed FeatherOS systems
overwrite: false
prefer_grub_d: false
keep_distributor: true
defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: saved
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: console
  GRUB_DISABLE_RECOVERY: true
  GRUB_DISTRIBUTOR: FeatherOS
always_use_defaults: false
