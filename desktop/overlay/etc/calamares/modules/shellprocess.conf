# Post-install cleanup inside the newly installed FeatherOS target root
dontChroot: false
timeout: 60
script:
  - "rm -f /etc/lightdm/lightdm.conf.d/50-featheros.conf"
  - "rm -f /etc/sudoers.d/90-feather"
  - "rm -f /etc/systemd/system/feather-boot-report.service /etc/systemd/system/multi-user.target.wants/feather-boot-report.service"
  - "rm -f /home/*/Desktop/feather-install.desktop /etc/skel/Desktop/feather-install.desktop"
