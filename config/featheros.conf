# FeatherOS Build & Release Configuration
OS_NAME="FeatherOS"
OS_ID="featheros"
OS_VERSION="0.5.0"
OS_CODENAME="plume-wholesome"
OS_PRETTY_NAME="FeatherOS 0.5.0 (Plume Wholesome)"

# Base Debian suite ("trixie" = Debian 13 modern XFCE 4.20 + Wine + PipeWire)
DEBIAN_SUITE="${DEBIAN_SUITE:-trixie}"
DEBIAN_ARCH="amd64"
DEBIAN_MIRROR="${DEBIAN_MIRROR:-http://deb.debian.org/debian}"
ENABLE_MULTIARCH_I386="true"

# Live session defaults
LIVE_USER="feather"
LIVE_HOSTNAME="featheros"
ISO_LABEL="FEATHEROS_0_5"
ISO_FILENAME="featheros-${OS_VERSION}-${DEBIAN_ARCH}.iso"

# Compression & memory tuning
SQUASHFS_COMP="zstd"
ZRAM_PERCENT="50"
