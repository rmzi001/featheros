# FeatherOS Central Build & Identity Configuration
OS_NAME="FeatherOS"
OS_ID="featheros"
OS_VERSION="0.2.0"
OS_CODENAME="plume-fluent"
OS_PRETTY_NAME="FeatherOS 0.2.0 (Plume Fluent)"
OS_URL="https://github.com/rmzi001/featheros"

# Base Debian settings (override via environment variables if desired)
DEBIAN_SUITE="${DEBIAN_SUITE:-trixie}"
DEBIAN_MIRROR="${DEBIAN_MIRROR:-http://deb.debian.org/debian}"
DEBIAN_ARCH="amd64"
ENABLE_MULTIARCH_I386="true"

# Live ISO & Image Settings
ISO_LABEL="FEATHEROS_0_2"
ISO_FILENAME="featheros-${OS_VERSION}-${DEBIAN_ARCH}.iso"
SQUASHFS_COMP="zstd"
LIVE_USER="feather"
LIVE_HOSTNAME="featheros"

# Default system limits & performance targets
ZRAM_PERCENT="50"
ZRAM_ALGO="zstd"
DEFAULT_PROFILE="balanced"
